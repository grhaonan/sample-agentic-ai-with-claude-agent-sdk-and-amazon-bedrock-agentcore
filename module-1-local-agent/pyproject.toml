[project]
name = "module-1-local-agent"
version = "0.1.0"
description = "Workshop Module 1 — Build a Local Agent (Chief of Staff) with Claude Agent SDK on Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.51",   # cookbook baseline; uses output-styles / plan-mode / project+local settings
    "python-dotenv>=1.1.1",
    "ipykernel>=6.29",            # Jupyter kernel for the notebook
    "boto3>=1.34",                # optional Bedrock access / credential check in the setup cell
]
